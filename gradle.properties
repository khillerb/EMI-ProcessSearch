org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
# Prominence II: Hasturian Era v4.0.2 runs Minecraft 1.20.1 on Fabric Loader 0.19.3.
# 1.20.1 ships Java 17 to end users, so that is what this targets.
minecraft_version=1.20.1
loader_version=0.19.3
fabric_api_version=0.92.11+1.20.1

## EMI
# This mod hooks EMI *internals* -- dev.emi.emi.search.EmiSearch$CompiledQuery.addQuery and the
# private EmiApi.setPages -- neither of which is published API. So we compile against the exact
# production jar the pack runs, vendored in libs/. That pins the mixin targets to reality: an EMI
# update that moved one of them fails the build instead of failing silently at runtime.
emi_version=1.1.24+1.20.1+fabric

## Create + Modern Industrialization -- compile-time only, every call site behind a
# FabricLoader.isModLoaded check. Both are vendored for the same reason JEI/MI were on NeoForge:
# ProcessingRecipe's heat field and MachineRecipe's eu field are implementation detail, and pinning
# to the pack's exact jar is what keeps the facet sources honest.
create_version=6.0.8.1+build.1744-mc1.20.1
mi_version=1.8.6

## Config UI -- both vendored from the pack, both optional at runtime. Mod Menu supplies the
# main-menu button and Cloth draws the screen; without either, the mod simply has no config screen.
cloth_version=11.1.136
modmenu_version=7.2.2

## Tests -- the facet rule engine only; see build.gradle.
junit_version=5.10.2

## Mod
mod_id=processsearch
mod_name=Process Search
mod_license=MIT
mod_version=0.3.0
mod_group_id=dev.processsearch
mod_description=Search EMI by machine and by recipe facet. Four filter prefixes: > made by, < used in, * machine for, ~ item class.
